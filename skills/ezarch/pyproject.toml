[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "ezarch"
version = "0.3.0"
description = "Optional tools and infrastructure for architectural drawings, models and visual expression"
requires-python = ">=3.12,<3.13"
license = "AGPL-3.0-or-later"
dependencies = [
  "PyYAML>=6.0.2,<7", "pydantic>=2.11,<3", "numpy>=2,<3",
  "shapely>=2.1,<3", "ezdxf==1.4.4", "pymupdf>=1.26,<2",
  "Pillow>=11,<13", "fonttools>=4.59,<5",
]

[project.optional-dependencies]
model = ["cadquery==2.6.1", "trimesh>=4.9,<6", "rhino3dm==8.35.0", "pycollada>=0.9,<1",
  "nlopt==2.9.1; sys_platform == 'darwin' and platform_machine == 'x86_64'"]
dev = ["pytest>=8,<10", "ruff>=0.12,<1", "build>=1.2,<2"]

[project.scripts]
ezarch = "ezarch.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/ezarch"]

[tool.hatch.build.targets.wheel.force-include]
"assets" = "ezarch/resources/assets"
"scripts/blender_scene.py" = "ezarch/resources/scripts/blender_scene.py"
"scripts/blender_verify.py" = "ezarch/resources/scripts/blender_verify.py"

[tool.pytest.ini_options]
testpaths = ["../../tests"]

[tool.ruff]
line-length = 110

[tool.uv]
environments = ["sys_platform == 'darwin'", "sys_platform == 'win32'"]
required-environments = [
  "sys_platform == 'darwin' and platform_machine == 'x86_64'",
  "sys_platform == 'darwin' and platform_machine == 'arm64'",
  "sys_platform == 'win32' and platform_machine == 'AMD64'",
]
